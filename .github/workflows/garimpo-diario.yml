name: Garimpo Diário de Ofertas Mercado Livre (YGA)

# Execução automática diária às 07:00 UTC + Gatilho Manual
on:
  schedule:
    # Rodar todos os dias às 07:00 UTC (04:00 Horário de Brasília)
    - cron: '0 7 * * *'
  # Permite disparar o workflow manualmente pela aba Actions do GitHub
  workflow_dispatch:

