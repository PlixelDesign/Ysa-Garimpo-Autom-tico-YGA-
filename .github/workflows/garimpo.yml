name: 🔍 Garimpo Diário YGA

on:
  schedule:
    - cron: '0 11,17,23 * * *'  # 8h, 14h, 20h horário de Brasília (UTC-3)
  workflow_dispatch:              # permite rodar manualmente pelo GitHub

jobs:
  garimpar:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout do repositório
        uses: actions/checkout@v4

      # supabase-js atual exige Node 22+ (WebSocket nativo); no Node 20 o worker quebrava ao iniciar
      - name: ⚙️ Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: 📦 Instala dependências
        run: npm ci

      - name: 🌐 Instala Playwright + Chromium com dependências
        run: npx playwright install chromium --with-deps

      # Sessão é opcional; printf evita quebrar o JSON quando ele contém aspas
      - name: 🔐 Restaura sessão do Mercado Livre
        env:
          ML_SESSION: ${{ secrets.ML_SESSION }}
        run: printf '%s' "$ML_SESSION" > ml-session.json

      - name: 🚀 Roda o Worker
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          CI: true
        run: node garimpo-worker.js
